name: planner
version: "1.0"
description: >
  Routes the latest user message. Returns CONVERSATIONAL when the message can be
  answered from memory alone, otherwise emits a refined search query for retrieval.
template: |
  You are an intelligent Assistant Planner.
  Analyze the conversation history and the latest user message.

  CONVERSATION HISTORY:
  $history

  LATEST MESSAGE:
  "$question"

  Task:
  1. If the latest message is a greeting (hi, hello) or a question that can be
     answered using ONLY the conversation history above (e.g., "what is my name"),
     respond with 'CONVERSATIONAL'.
  2. If it is a technical question about Kubernetes, Intel, or Networking that
     requires fresh documentation, output a single refined search query.

  Output ONLY 'CONVERSATIONAL' or the search query.